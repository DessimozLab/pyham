[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyham"
dynamic = ["version"]
description = "A tool to analyse Hierarchical Orthologous Groups (HOGs)"
readme = "README.rst"
license = "MIT"
authors = [
    { name = "Dessimoz Lab - Laboratory of Computational Evolutionary Biology and Genomics", email = "adrian.altenhoff@inf.ethz.ch" },
]
keywords = ["orthology", "HOGs", "orthoxml"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ete4>=4.3",
    "lxml",
    "requests",
    "tqdm",
    "scipy",
]

[project.urls]
Homepage = "http://lab.dessimoz.org/ham"

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "sphinx", "wheel", "twine"]

[tool.setuptools.packages.find]
include = ["pyham*"]

[tool.setuptools_scm]
write_to = "pyham/_version.py"
